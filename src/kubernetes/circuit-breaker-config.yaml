apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: events-service-circuit-breaker
  namespace: cinemaabyss
spec:
  host: events-service.cinemaabyss.svc.cluster.local
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 100
      http:
        http1MaxPendingRequests: 10
        http2MaxRequests: 100
        maxRequestsPerConnection: 10
    outlierDetection:
      consecutive5xxErrors: 5          # 5 ошибок подряд → вывести из балансировки
      interval: 30s                    # окно подсчёта
      baseEjectionTime: 30s            # минимальное время «карантина»
      maxEjectionPercent: 50           # не более 50% pod'ов одновременно
      