{{- if .Values.eventsService.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: events-service
  namespace: {{ .Values.global.namespace }}
  labels:
    app: events-service
    app.kubernetes.io/name: {{ include "cinemaabyss.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.eventsService.replicas }}
  selector:
    matchLabels:
      app: events-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: events-service
    spec:
      imagePullSecrets:
        - name: {{ .Values.imagePullSecrets.existingSecret | default "dockerconfigjson" }}
      containers:
      - name: events-service
        image: "{{ .Values.eventsService.image.repository }}:{{ .Values.eventsService.image.tag }}"
        imagePullPolicy: {{ .Values.eventsService.image.pullPolicy }}
        ports:
        - name: http
          containerPort: {{ .Values.eventsService.service.targetPort }}
          protocol: TCP
        env:
        - name: PORT
          value: {{ .Values.eventsService.service.targetPort | quote }}
        - name: LOG_LEVEL
          value: {{ .Values.eventsService.logLevel | default "INFO" | quote }}
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: {{ .Values.eventsService.kafka.bootstrapServers | default "kafka:9092" | quote }}
        - name: KAFKA_CLIENT_ID
          value: {{ .Values.eventsService.kafka.clientId | default "events-service" | quote }}
        - name: KAFKA_CONSUMER_GROUP
          value: {{ .Values.eventsService.kafka.consumerGroup | default "events-service" | quote }}
        - name: KAFKA_AUTO_OFFSET_RESET
          value: {{ .Values.eventsService.kafka.autoOffsetReset | default "earliest" | quote }}
        - name: TOPIC_MOVIE_EVENTS
          value: {{ .Values.eventsService.topics.movie | default "movie-events" | quote }}
        - name: TOPIC_USER_EVENTS
          value: {{ .Values.eventsService.topics.user | default "user-events" | quote }}
        - name: TOPIC_PAYMENT_EVENTS
          value: {{ .Values.eventsService.topics.payment | default "payment-events" | quote }}
        resources:
          {{- toYaml .Values.eventsService.resources | nindent 10 }}
        startupProbe:
          httpGet:
            path: /api/events/health
            port: {{ .Values.eventsService.service.targetPort }}
          periodSeconds: 5
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /api/events/health
            port: {{ .Values.eventsService.service.targetPort }}
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /api/events/health
            port: {{ .Values.eventsService.service.targetPort }}
          initialDelaySeconds: 20
          periodSeconds: 20
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: events-service
  namespace: {{ .Values.global.namespace }}
  labels:
    app: events-service
    app.kubernetes.io/name: {{ include "cinemaabyss.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  selector:
    app: events-service
  ports:
  - name: http
    port: {{ .Values.eventsService.service.port }}
    targetPort: {{ .Values.eventsService.service.targetPort }}
    protocol: TCP
  type: {{ .Values.eventsService.service.type }}
{{- end }}